# Render Blueprint -- https://render.com/docs/blueprint-spec
#
# Deploys the backend only. The frontend is deployed separately on Vercel
# (see DEPLOYMENT.md).
#
# After connecting this repo in the Render dashboard, it'll prompt for the
# env vars below marked `sync: false` -- fill those in there, never commit
# real values to this file.
services:
  - type: web
    name: consulting-opportunities-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Postgres connection string from Neon/Supabase/etc, e.g.
      # postgresql://user:pass@host/dbname
      - key: DATABASE_URL
        sync: false
      # JSON array of allowed origins -- pydantic parses this as JSON, not a
      # plain string, e.g. ["https://your-app.vercel.app"]
      - key: BACKEND_CORS_ORIGINS
        sync: false
      # Optional: regex matching additional allowed origins, useful because
      # Vercel gives every preview deployment a new URL. E.g. for a project
      # called "frontend" under Vercel team "your-team-projects":
      # ^https://frontend(-[a-zA-Z0-9]+)*-your-team-projects\.vercel\.app$
      - key: BACKEND_CORS_ORIGIN_REGEX
        sync: false
      # false in production -- scraping is triggered by the scheduled
      # GitHub Actions workflow (see .github/workflows/scrape-cron.yml)
      # hitting /api/opportunities/refresh, not by every cold start.
      - key: SCRAPE_ON_STARTUP
        value: "false"
      - key: SCRAPE_HOUR_UTC
        value: "6"
      # Email digest via SendGrid (https://sendgrid.com) -- plain SMTP
      # doesn't work here since Render blocks outbound SMTP ports on every
      # plan. FROM_EMAIL must be a SendGrid "Single Sender" verified email
      # (no domain/DNS needed -- see backend/.env.example).
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      # Physical mailing address shown in the digest footer (CAN-SPAM/CASL
      # requirement for opt-in bulk email; also helps deliverability).
      - key: MAILING_ADDRESS
        sync: false
      # This service's own public URL, used to build the digest's one-click
      # unsubscribe link, e.g. https://consulting-opportunities-api.onrender.com
      - key: BACKEND_PUBLIC_URL
        sync: false
